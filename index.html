<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LiMada.mg</title>
<style>
:root{--bg:#f6eef0;--card:#fff;--ink:#2a1219;--mute:#7a5f67;--line:#e6d3d8;--acc:#8e2545;--in:#efe1e5}
@media(prefers-color-scheme:dark){:root{--bg:#1c0d13;--card:#2a1620;--ink:#f6e9ed;--mute:#b99aa5;--line:#4a2a37;--acc:#d05b86;--in:#3a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.w{max-width:520px;margin:0 auto;padding:16px}h1,h2{font-family:Georgia,serif;margin:8px 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}
button{border:0;border-radius:999px;padding:11px 16px;font:inherit;font-weight:700;color:#fff;background:var(--acc);cursor:pointer;margin:8px 6px 0 0}
button.alt{background:none;color:var(--acc);border:1px solid var(--acc)}
.m{color:var(--mute);font-size:14px}.e{color:#c0392b;min-height:22px}
.bar{display:flex;justify-content:space-between;align-items:center}
.msgs{height:58vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--bg);border-radius:12px}
.b{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--in);word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--acc);color:#fff}.b small{display:block;opacity:.7}
.row{display:flex;gap:8px}.row input{flex:1}
img.s{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px}
</style></head><body><div class="w" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://kirmjwaoezodghrqsier.supabase.co","sb_publishable_YmulAKWztcwPIVNQTAwulA_2-JNRxvC");
const INV=new URLSearchParams(location.search).get("invite");
const app=document.getElementById("app");let timer,me,box;
function h(t,p,...k){const e=Object.assign(document.createElement(t),p||{});k.flat().forEach(x=>e.append(x));return e}
function show(...n){clearInterval(timer);app.replaceChildren(...n)}
function field(l,el){return [h("label",{},l),el]}
const out=()=>h("button",{className:"alt",onclick:async()=>{await sb.auth.signOut();start()}},"Déconnexion");

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  const {data:p}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  me=p;
  if(!p)return show(h("div",{className:"c"},h("h2",{},"Compte introuvable"),out()));
  if(p.status==="pending")return show(h("div",{className:"c"},h("h2",{},"Demande envoyée"),h("p",{},"Le gérant vérifie votre dossier. Revenez plus tard."),out()));
  if(p.status==="banned")return show(h("div",{className:"c"},h("h2",{},"Accès refusé"),out()));
  mainView();
}

function authView(){
  const em=h("input",{type:"email",autocomplete:"email"}),pw=h("input",{type:"password",autocomplete:"current-password"}),er=h("div",{className:"e"});
  const go=h("button",{onclick:async()=>{const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
    if(error)er.textContent="Email ou mot de passe incorrect.";else start()}},"Se connecter");
  const k=[h("h1",{},"LiMada.mg"),h("p",{className:"m"},"Accès sur invitation seulement."),
    h("div",{className:"c"},field("Email",em),field("Mot de passe",pw),er,go)];
  if(INV)k.push(h("div",{className:"c"},h("p",{},"Vous avez un lien d'invitation."),h("button",{onclick:signupView},"Créer mon compte")));
  show(...k);
}

function signupView(){
  let voice=null,rec;
  const f={};["pseudo","email","password","fb_link","fb_name"].forEach(n=>f[n]=h("input",{type:n==="password"?"password":n==="email"?"email":"text",autocomplete:"off"}));
  f.sexe=h("select",{},...["","Femme","Homme"].map(x=>h("option",{value:x},x||"Choisir…")));
  f.dob=h("input",{type:"date"});
  f.why=h("select",{},...["","Faire des rencontres entre adultes","Discuter en toute discrétion","Trouver un couple ou un partenaire libertin","Autre raison"].map(x=>h("option",{value:x},x||"Choisir…")));
  f.about=h("textarea",{rows:3});
  const rules=h("input",{type:"checkbox"}),selfie=h("input",{type:"file",accept:"image/*",capture:"user"});
  const aud=h("audio",{controls:true,style:"width:100%;display:none"}),er=h("div",{className:"e"});
  const rb=h("button",{className:"alt",type:"button"},"🎤 Enregistrer (15 s max)");
  rb.onclick=async()=>{
    if(rec&&rec.state==="recording"){rec.stop();return}
    try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);const ch=[];
      rec.ondataavailable=e=>ch.push(e.data);
      rec.onstop=()=>{voice=new Blob(ch,{type:rec.mimeType});st.getTracks().forEach(t=>t.stop());aud.src=URL.createObjectURL(voice);aud.style.display="block";rb.textContent="🎤 Réenregistrer"};
      rec.start();rb.textContent="⏹ Arrêter";setTimeout(()=>rec.state==="recording"&&rec.stop(),15000)}
    catch(x){er.textContent="Micro refusé. Autorisez le micro."}};
  const send=h("button",{onclick:async()=>{
    er.textContent="";const v=n=>f[n].value.trim();
    const age=(Date.now()-new Date(f.dob.value))/31557600000;
    if(v("pseudo").length<3)return er.textContent="Pseudo : 3 lettres minimum.";
    if(!f.sexe.value)return er.textContent="Indiquez femme ou homme.";
    if(!f.dob.value||age<18)return er.textContent="Réservé aux 18 ans et plus.";
    if(!v("email")||f.password.value.length<8)return er.textContent="Email et mot de passe (8 caractères minimum).";
    if(!/^https:\/\/(www\.|m\.|web\.)?(facebook\.com|fb\.com)\/.{3,}/i.test(v("fb_link")))return er.textContent="Lien Facebook : https://facebook.com/votre.nom";
    if(v("fb_name").length<3||!f.why.value||v("about").length<20)return er.textContent="Remplissez tous les champs (présentation : 2 phrases).";
    if(!rules.checked)return er.textContent="Acceptez les règles.";
    if(!selfie.files[0])return er.textContent="Ajoutez votre selfie.";
    if(!voice)return er.textContent="Enregistrez votre vocal.";
    send.disabled=true;
    const {data,error}=await sb.auth.signUp({email:v("email"),password:f.password.value,options:{data:{invite:INV,pseudo:v("pseudo"),sexe:f.sexe.value,dob:f.dob.value,fb_link:v("fb_link"),fb_name:v("fb_name"),why:f.why.value,about:v("about")}}});
    if(error||!data.session){send.disabled=false;return er.textContent=error?"Invitation invalide, ou email déjà utilisé.":"Désactivez « Confirm email » dans Supabase."}
    const id=data.user.id;
    const a=await sb.storage.from("docs").upload(id+"/selfie",selfie.files[0],{upsert:true});
    const b=await sb.storage.from("docs").upload(id+"/voice",voice,{upsert:true,contentType:voice.type});
    if(a.error||b.error)er.textContent="Photo ou vocal non envoyé. Contactez le gérant.";
    start();
  }},"Envoyer ma demande");
  show(h("h1",{},"Rejoindre LiMada.mg"),h("div",{className:"c"},
    field("Pseudo (visible)",f.pseudo),field("Vous êtes",f.sexe),field("Date de naissance",f.dob),
    field("Email",f.email),field("Mot de passe",f.password),
    field("Lien de votre profil Facebook (vu seulement par le gérant)",f.fb_link),field("Nom affiché sur ce Facebook",f.fb_name),
    field("Pourquoi rejoindre ?",f.why),field("Parlez de vous (2 phrases)",f.about),
    h("label",{},rules," J'ai 18 ans ou plus. Le consentement est obligatoire. Pas de harcèlement. Aucune photo partagée sans accord. Je peux être banni."),
    field("Selfie (visage bien visible)",selfie),field("Vocal : « Bonjour, je m'appelle … »",h("div",{},rb,aud)),er,send,
    h("button",{className:"alt",onclick:authView},"Retour")));
}

function mainView(){
  const body=h("div"),tabs=h("div",{className:"bar"});
  const t1=h("button",{onclick:()=>{chatView(body)}},"Groupe");
  tabs.append(h("b",{},"LiMada.mg"),t1);
  if(me.is_admin)tabs.append(h("button",{className:"alt",onclick:()=>{clearInterval(timer);box=body;adminView()}},"Gérant"));
  tabs.append(out());
  app.replaceChildren(tabs,body);chatView(body);
}

async function chatView(b){
  const list=h("div",{className:"msgs"}),inp=h("input",{placeholder:"Écrire dans le groupe…",maxLength:1000});
  const sendMsg=async()=>{const t=inp.value.trim();if(!t)return;inp.value="";
    const {error}=await sb.from("messages").insert({user_id:me.id,body:t});if(error)alert("Message non envoyé.");load()};
  inp.onkeydown=e=>{if(e.key==="Enter")sendMsg()};
  b.replaceChildren(list,h("div",{className:"row",style:"margin-top:8px"},inp,h("button",{onclick:sendMsg,style:"margin:0"},"➤")));
  async function load(){const {data}=await sb.from("messages").select("*").order("created_at",{ascending:false}).limit(100);
    if(!data)return;list.replaceChildren(...data.reverse().map(m=>h("div",{className:"b"+(m.user_id===me.id?" me":"")},h("small",{},m.pseudo||"?"),m.body)));list.scrollTop=list.scrollHeight}
  load();clearInterval(timer);timer=setInterval(load,4000);
}

async function setStatus(id,s){const {error}=await sb.from("profiles").update({status:s}).eq("id",id);if(error)alert(error.message);adminView()}
async function view(p,wrap){
  const [a,c]=await Promise.all([sb.storage.from("docs").createSignedUrl(p.id+"/selfie",300),sb.storage.from("docs").createSignedUrl(p.id+"/voice",300)]);
  wrap.replaceChildren(a.data?h("img",{className:"s",src:a.data.signedUrl}):"Pas de photo",c.data?h("audio",{controls:true,src:c.data.signedUrl,style:"width:100%"}):"Pas de vocal");
}
async function adminView(){
  const {data:ps}=await sb.from("profiles").select("*").order("created_at",{ascending:false});
  const {data:iv}=await sb.from("invites").select("*").order("created_at",{ascending:false});
  const card=(p,pend)=>{const w=h("div"),age=Math.floor((Date.now()-new Date(p.dob))/31557600000);
    const fb=/^https:\/\//.test(p.fb_link||"")?h("a",{href:p.fb_link,target:"_blank",rel:"noopener noreferrer"},p.fb_link):h("span",{},p.fb_link||"");
    const c=h("div",{className:"c"},h("b",{},p.pseudo+" · "+p.sexe+" · "+age+" ans"),h("div",{className:"m"},p.status),h("p",{},p.why+" — "+p.about),h("div",{className:"m"},"Facebook : ",fb," (",p.fb_name||"",")"),w);
    c.append(h("button",{className:"alt",onclick:()=>view(p,w)},"Photo et vocal"));
    if(pend){c.append(h("button",{onclick:()=>setStatus(p.id,"active")},"Accepter"),h("button",{className:"alt",onclick:()=>setStatus(p.id,"banned")},"Refuser"))}
    else if(p.id!==me.id){c.append(p.status==="banned"?h("button",{onclick:()=>setStatus(p.id,"active")},"Réactiver"):h("button",{className:"alt",onclick:()=>setStatus(p.id,"banned")},"Bannir"))}
    return c};
  const link=c=>location.origin+location.pathname+"?invite="+c;
  const inv=x=>h("div",{className:"c"},h("b",{},x.code),h("div",{className:"m"},x.active?"Actif":"Désactivé"),
    h("button",{onclick:()=>navigator.clipboard.writeText(link(x.code)).then(()=>alert("Lien copié"))},"Copier le lien"),
    h("button",{className:"alt",onclick:async()=>{await sb.from("invites").update({active:!x.active}).eq("code",x.code);adminView()}},x.active?"Désactiver":"Activer"));
  const nw=h("button",{onclick:async()=>{const a=new Uint8Array(6);crypto.getRandomValues(a);const code=[...a].map(n=>(n%36).toString(36)).join("");
    const {error}=await sb.from("invites").insert({code});if(error)alert(error.message);adminView()}},"Nouveau lien d'invitation");
  box.replaceChildren(h("h2",{},"Demandes"),...ps.filter(p=>p.status==="pending").map(p=>card(p,true)),
    h("h2",{},"Membres"),...ps.filter(p=>p.status!=="pending").map(p=>card(p,false)),
    h("h2",{},"Invitations"),nw,...iv.map(inv));
}
start();
</script></body></html>
